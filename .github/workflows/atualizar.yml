name: Atualizar normativos

on:
  schedule:
    # Segunda a sábado, 07:30 (Brasília): atualização incremental (ano atual e anterior + temas + gov.br)
    - cron: '30 10 * * 1-6'
    # Domingo, 07:30 (Brasília): recoleta completa, para captar revogações e alterações de atos antigos
    - cron: '30 10 * * 0'
  workflow_dispatch:
    inputs:
      completo:
        description: 'Recoletar todos os anos (demora mais)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'config/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: atualizar-normativos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pdfjs-dist: leitura dos quadros de coordenadas das DUPs (mapa)
      - name: Instalar dependências
        if: github.event_name != 'push'
        run: npm ci --no-audit --no-fund

      - name: Coletar normativos
        if: github.event_name != 'push'
        run: |
          if [ "${{ github.event.schedule }}" = "30 10 * * 0" ] || [ "${{ inputs.completo }}" = "true" ]; then
            node scripts/coletar.mjs --completo
          else
            node scripts/coletar.mjs
          fi

      # Compara com a versão anterior (ainda no Git) e avisa por issue/e-mail os atos novos das concessões acompanhadas
      - name: Verificar novidades
        if: github.event_name != 'push'
        run: node scripts/novidades.mjs --saida=novidades.md

      - name: Avisar novidades
        if: github.event_name != 'push' && hashFiles('novidades.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create novidades --color 1351b4 --description "Atos novos das concessões acompanhadas" --force
          gh issue create --title "$(cat novidades.md.titulo)" --body-file novidades.md --label novidades

      # E-mail direto para os endereços de config/alertas.json. Só roda se os Secrets SMTP_* estiverem configurados
      # (Settings → Secrets and variables → Actions): SMTP_SERVIDOR, SMTP_PORTA, SMTP_USUARIO, SMTP_SENHA.
      - name: Preparar e-mail
        id: email
        if: github.event_name != 'push' && hashFiles('novidades.md') != ''
        env:
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
        run: |
          echo "para=$(node -e "console.log((require('./config/alertas.json').emails||[]).join(','))")" >> "$GITHUB_OUTPUT"
          echo "assunto=$(cat novidades.md.titulo)" >> "$GITHUB_OUTPUT"
          if [ -n "$SMTP_USUARIO" ]; then echo "ativo=sim" >> "$GITHUB_OUTPUT"; else echo "Secrets SMTP não configurados: e-mail não enviado (o aviso no GitHub foi criado)."; fi

      - name: Enviar e-mail
        if: steps.email.outputs.ativo == 'sim' && steps.email.outputs.para != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVIDOR }}
          server_port: ${{ secrets.SMTP_PORTA }}
          secure: ${{ secrets.SMTP_PORTA == '465' }}
          username: ${{ secrets.SMTP_USUARIO }}
          password: ${{ secrets.SMTP_SENHA }}
          from: Painel Normativos ANTT <${{ secrets.SMTP_USUARIO }}>
          to: ${{ steps.email.outputs.para }}
          subject: ${{ steps.email.outputs.assunto }}
          html_body: file://novidades.md
          convert_markdown: true

      - name: Salvar dados no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos normativos."
          else
            git commit -m "Atualiza normativos ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
          fi

      # Carimba a versão nos links de CSS/JS para o navegador nunca usar um arquivo antigo do cache
      - name: Versionar arquivos do site
        run: sed -i "s/?v=[A-Za-z0-9]*\"/?v=${GITHUB_SHA::8}\"/g" site/*.html site/assets/*.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publicacao
        uses: actions/deploy-pages@v4
