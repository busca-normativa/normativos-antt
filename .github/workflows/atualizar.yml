name: Atualizar normativos

on:
  schedule:
    # Segunda a sábado, 07:30 (Brasília): atualização incremental (ano atual e anterior + temas + gov.br)
    - cron: '30 10 * * 1-6'
    # Domingo, 07:30 (Brasília): recoleta completa, para captar revogações e alterações de atos antigos
    - cron: '30 10 * * 0'
  workflow_dispatch:
    inputs:
      completo:
        description: 'Recoletar todos os anos (demora mais)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', 'config/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-normativos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Coletar normativos
        if: github.event_name != 'push'
        run: |
          if [ "${{ github.event.schedule }}" = "30 10 * * 0" ] || [ "${{ inputs.completo }}" = "true" ]; then
            node scripts/coletar.mjs --completo
          else
            node scripts/coletar.mjs
          fi

      - name: Salvar dados no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos normativos."
          else
            git commit -m "Atualiza normativos ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publicacao
        uses: actions/deploy-pages@v4
